<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luis Martínez · Artefactos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Manuscrita (Homemade Apple, provisional) + máquina de escribir (Special Elite para textos grandes, Courier Prime para pequeños) -->
<link href="https://fonts.googleapis.com/css2?family=Homemade+Apple&family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="intro">
<aside id="side" aria-label="Menú">
  <div class="sec head">
    <div>
      <h1 class="logo" id="siteName"></h1>
      <div class="tag" id="siteTag"></div>
    </div>
    <button id="fold" class="sq" aria-label="Plegar menú" title="Plegar menú">‹</button>
  </div>
  <div class="sec"><p id="siteBio"></p></div>
  <div class="sec">
    <h2>Proyectos</h2>
    <ol id="list"></ol>
  </div>
  <button class="sec row" id="navContact"><span>Contacto</span><span>→</span></button>
  <button class="sec row" id="navInfo"><span>Pedir información</span><span>→</span></button>
  <div class="spacer"></div>
  <div class="sec tools">
    <button class="tbtn" id="reset">Recoger piezas</button>
    <button class="tbtn" id="lupa" title="Modo lupa: un clic abre el proyecto de la pieza">Lupa</button>
  </div>
  <div class="sec foot" id="siteFoot"></div>
</aside>

<main id="view">
  <div id="board"></div>
  <div id="intro">
    <div class="title"><span id="typed"></span><span class="tw-cursor"></span></div>
    <div class="by" id="introBy"></div>
    <div class="load" id="load">000%</div>
  </div>
  <canvas id="gl"></canvas>
  <div id="topbar">
    <button id="unfold" class="sq" aria-label="Desplegar menú" title="Desplegar menú">☰</button>
    <button id="home" class="back">← volver a la mesa</button>
  </div>
  <div id="hint">Arrastra la mat para moverte · agarra las piezas por cualquier punto y lánzalas · doble clic en una pieza para ver su proyecto</div>
</main>
<div id="tip"></div>
<div id="err" hidden></div>

<script>
  window.addEventListener('error', function (e) {
    var d = document.getElementById('err');
    d.hidden = false;
    d.textContent = 'Error: ' + e.message + ' (línea ' + e.lineno + ')';
  });
  /* Efecto máquina de escribir del preloader (equivalente al Typewriter de Framer). No depende de three.js. */
  window.typewriter = function (el, text, o, done) {
    o = o || {};
    var cursor = el.nextElementSibling, i = 0;
    setTimeout(function step() {
      el.textContent = text.slice(0, ++i);
      if (i < text.length) return setTimeout(step, (o.speed || 95) + Math.random() * (o.jitter || 90));
      if (cursor) cursor.classList.remove('typing');
      if (done) done();
    }, o.delay || 0);
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineSegmentsGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineMaterial.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineSegments2.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
